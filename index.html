<style>
/* Layout idea: bright pastel study app. Lavender page, white cards, gradient subject bands and a purple-to-pink action colour. Single bright theme by choice. */
:root{
  --bg:#F3EBFF; --surface:#FFFFFF; --surface2:#EFE8FB; --ink:#1B1535; --muted:#6B6586; --line:#E4DAF5;
  --accent:#9B3FE0; --on-accent:#FFFFFF; --good:#18A86B; --warn:#C27A06; --bad:#D8433F;
  --phy:#1F7FC4; --che:#E0523F; --mat:#8450DC; --on-c:#FFFFFF;
  --g-phy:linear-gradient(135deg,#15809A,#3868D6);
  --g-che:linear-gradient(135deg,#D63E2D,#E0632B);
  --g-mat:linear-gradient(135deg,#7E48D8,#C9558A);
  --grad:linear-gradient(135deg,#A23FE6,#EE3F98);
  --hero-bg:linear-gradient(135deg,#7A3FE4,#E63E9A); --hero-ink:#FFFFFF; --hero-hi:#FFFFFF;
  --shadow:0 10px 28px rgba(110,60,200,.12);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(800px 260px at 50% -60px,color-mix(in srgb,var(--accent) 14%,transparent),transparent),var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom)) 0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:640px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px}
.top .brand{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.top .date{color:var(--muted);font-size:13px;margin-top:2px}
.topr{display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cd-chip{font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.cd-chip b{font-weight:500;color:var(--accent)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.adviser{background:var(--hero-bg);color:var(--hero-ink);border:none;padding:18px;display:flex;flex-direction:column;gap:10px}
.adviser .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.adviser .lbl{font-family:var(--f-mono);font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.adviser h2{font-size:24px;margin:4px 0 0;line-height:1.15;color:var(--hero-hi)}
.adviser p{margin:0;font-size:15px}
.adviser .lines{padding-top:12px;border-top:1px solid color-mix(in srgb,var(--hero-ink) 22%,transparent);display:flex;flex-direction:column;gap:8px;font-size:14px}
.ring{flex:none;position:relative;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring .tr{stroke:color-mix(in srgb,var(--hero-ink) 22%,transparent)}
.ring .pg{stroke:var(--hero-hi)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.sum{display:flex;flex-direction:column;gap:10px}
.sumrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px;color:var(--muted)}
.sumrow b{font-family:var(--f-display);font-size:22px;color:var(--ink)}
.bar{height:9px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:999px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.blk{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.blk.s-phy{border-left-color:var(--phy)} .blk.s-che{border-left-color:var(--che)} .blk.s-mat{border-left-color:var(--mat)}
.blk.k-rev,.blk.k-rec,.blk.k-mock,.blk.k-coach{border-left-color:var(--accent)}
.blk.is-now{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.blk.is-done{opacity:.7}
.bh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.time{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--muted)}
.s-phy .pill{background:color-mix(in srgb,var(--phy) 16%,var(--surface));color:var(--phy)}
.s-che .pill{background:color-mix(in srgb,var(--che) 16%,var(--surface));color:var(--che)}
.s-mat .pill{background:color-mix(in srgb,var(--mat) 16%,var(--surface));color:var(--mat)}
.blk h3{font-size:19px;line-height:1.25}
.hint{font-size:13px;color:var(--muted)}
.brk{display:flex;justify-content:space-between;gap:10px;padding:8px 16px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
.tasks{display:flex;flex-direction:column;gap:2px}
.task{position:relative;display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:8px 0;cursor:pointer}
.task input{position:absolute;opacity:0;width:1px;height:1px}
.task .box{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center;background:var(--surface)}
.task input:checked + .box{background:var(--good);border-color:var(--good)}
.task input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--on-c);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.task input:disabled + .box{opacity:.5}
.task .txt{font-size:15px}
.task.is-done .txt{color:var(--muted);text-decoration:line-through}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700;font-size:14px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,.seg button:focus-visible,.mini:focus-visible,.cd:focus-visible,.tab:focus-visible,.pip:focus-visible,.icon-btn:focus-visible,.chipbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:36px}
.mini[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px}
.ok{color:var(--good);font-weight:700;font-size:14px}
.mine h3{font-size:16px;margin-bottom:4px}
form.row{display:flex;gap:8px;margin-top:6px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;font-family:var(--f-mono);font-size:12px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sect{display:flex;flex-direction:column;gap:10px}
.sect h2{font-size:22px}
.muted{color:var(--muted);font-size:14px}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal-head h2{font-size:20px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.cd{aspect-ratio:1/1.08;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--good) var(--p,0%),var(--surface));padding:4px 5px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;cursor:pointer;text-align:left;min-width:0}
.cd.empty{border:0;background:transparent;cursor:default}
.cd .n{font-size:14px;font-weight:700}
.cd.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.is-sel{outline:3px solid var(--accent);outline-offset:1px}
.cd .ex{font-family:var(--f-mono);font-size:9px;background:var(--bad);color:#fff;border-radius:4px;padding:0 3px;line-height:14px}
.legend{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(6,1fr);padding:6px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:12px;cursor:pointer;min-height:52px;border-radius:18px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--on-accent);background:var(--accent);font-weight:700}
.subj-card{display:flex;flex-direction:column;gap:6px}
.subj-card .row{display:flex;justify-content:space-between;align-items:baseline}
.subj-card b{font-family:var(--f-display);font-size:18px}
.subj-card .bar>i{background:var(--c)}
.chrow{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.chrow.is-focus{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.chtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chtop b{font-size:16px}
.hy{font-family:var(--f-mono);font-size:10px;background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.pips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;font-size:12px;cursor:pointer;min-height:44px;line-height:1.2}
.pip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-c);font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--f-display);font-size:26px;color:var(--accent)}
.tile span{font-size:12px;color:var(--muted)}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:9px}
svg.chart .b{fill:var(--accent)}
svg.chart .t{stroke:var(--warn);stroke-dasharray:3 3;stroke-width:1}
.mist{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.mist .txt{flex:1;font-size:15px}
.mist.fixed .txt{color:var(--muted);text-decoration:line-through}
.days{display:flex;gap:6px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.pgroup{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.prow .yr{font-family:var(--f-mono);font-size:14px;min-width:44px}
.prow .chipset{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:38px}
.chipbtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--on-c);font-weight:700}
.prow{flex-direction:column;align-items:stretch;gap:8px}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pfiles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pdfitem{display:inline-flex;gap:4px}
.attach{position:relative;display:inline-flex;align-items:center;cursor:pointer;border-style:dashed}
.attach input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.attach:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.answer{white-space:pre-wrap;background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
details.hist{border-top:1px solid var(--line);padding:10px 0}
details.hist summary{cursor:pointer;font-size:15px;min-height:32px}
details.hist summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pcount{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:5}
#toast.on{opacity:1}
.warnbox{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* POCKET ADVISER 2027 — refined editorial study theme */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface2:#EAF0EE; --ink:#172B2A; --muted:#647572; --line:#DCE5E1;

/* ---------- date and time helpers ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((parse(a)-parse(b))/864e5);}
function today(){return ymd(new Date());}
function toMin(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function t12(min){min=((min%1440)+1440)%1440;var h=Math.floor(min/60),m=min%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap;}
function longDate(s){var d=parse(s);return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()];}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hm(mins){var h=Math.floor(mins/60),m=mins%60;return h>0?(h+'h '+pad(m)+'m'):(m+'m');}

/* ---------- state ---------- */
var storageOK=true;
var state;
// Supabase free-tier cloud sync. Only the publishable key is embedded in this client.
var SB_URL='https://yyqloliogtfkvnpgprgw.supabase.co';
var SB_KEY='sb_publishable_oDqVRnsAJg5eHas25eIjqQ_qHPoU-qg';
var sbClient=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SB_URL,SB_KEY):null;
var sbUser=null,sbBusy=false,sbTimer=null,sbStatus='Not signed in';
function setSyncStatus(s){sbStatus=s;var el=document.getElementById('sync-status');if(el)el.textContent=s;}
async function syncPush(){
  if(!sbClient||!sbUser||sbBusy)return;
  sbBusy=true;setSyncStatus('Syncing…');
  try{
    var row={id:'main',user_id:sbUser.id,record_type:'app_state',data:state,updated_at:new Date().toISOString()};
    var res=await sbClient.from('user_records').upsert(row,{onConflict:'user_id,id'});
    if(res.error)throw res.error;
    setSyncStatus('Synced · '+new Date().toLocaleTimeString());
  }catch(e){setSyncStatus('Sync error · check connection');}
  finally{sbBusy=false;}
}
function queueSync(){if(!sbUser)return;clearTimeout(sbTimer);sbTimer=setTimeout(syncPush,1200);}
async function connectCloud(mode){
  if(!sbClient){toast('Cloud service could not load. Check internet.');return;}
  var email=(document.getElementById('cloud-email')||{}).value||'';
  var password=(document.getElementById('cloud-password')||{}).value||'';
  if(!email.trim()||!password){toast('Enter email and password.');return;}
  setSyncStatus('Connecting…');
  try{
    var result= mode==='signup' ? await sbClient.auth.signUp({email:email.trim(),password:password}) : await sbClient.auth.signInWithPassword({email:email.trim(),password:password});
    if(result.error)throw result.error;
    if(!result.data.session){setSyncStatus('Check your email to confirm account');toast('Account created. Confirm your email, then sign in.');return;}
    sbUser=result.data.user;await loadCloudState();render();
    toast(mode==='signup'?'Account created and sync enabled.':'Cloud sync connected.');
  }catch(e){setSyncStatus('Sign-in failed');toast(e.message||'Could not connect.');}
}
async function loadCloudState(){
  if(!sbClient||!sbUser)return;
  setSyncStatus('Loading cloud data…');
  try{
    var res=await sbClient.from('user_records').select('data,updated_at').eq('user_id',sbUser.id).eq('id','main').maybeSingle();
    if(res.error)throw res.error;
    if(res.data&&res.data.data){
      var remoteTime=Date.parse(res.data.updated_at||0);
      var localTime=Number(localStorage.getItem(LS+'.cloudUpdated')||0);
      if(remoteTime>localTime){state=normaliseState(res.data.data);localStorage.setItem(LS,JSON.stringify(state));}
    }else{await syncPush();return;}
    localStorage.setItem(LS+'.cloudUpdated',String(Date.now()));setSyncStatus('Cloud sync ready');
  }catch(e){setSyncStatus('Cloud load failed');toast('Could not load cloud data. Local data is safe.');}
}
async function initCloud(){
  if(!sbClient){setSyncStatus('Cloud SDK unavailable');return;}
  try{var r=await sbClient.auth.getSession();if(r.data.session){sbUser=r.data.session.user;await loadCloudState();if(tab==='settings')render();}}
  catch(e){setSyncStatus('Offline · local save active');}
  sbClient.auth.onAuthStateChange(function(event,session){
    sbUser=session&&session.user?session.user:null;
    if(sbUser){setTimeout(function(){loadCloudState().then(function(){render();});},0);}
    else{setSyncStatus('Not signed in');render();}

}
async function disconnectCloud(){if(sbClient)await sbClient.auth.signOut();sbUser=null;setSyncStatus('Not signed in');render();}

function DEF(){return {

  exams:{jee1:'2027-01-22',board:'2027-02-25',gujcet:'2027-03-20',jee2:'2027-04-02'}
};}
function normaliseState(o){
  var d=DEF();
  if(!o||typeof o!=='object'||Array.isArray(o)) return d;
  var x=Object.assign(d,o);
  x.exams=Object.assign(DEF().exams,o.exams&&typeof o.exams==='object'?o.exams:{});
  ['papers','pyqStatus','stage','focus','done','snap','modes','custom','hold','dayOver','focusMin','last'].forEach(function(k){if(!x[k]||typeof x[k]!=='object'||Array.isArray(x[k])) x[k]={};});
  ['pdfs','doubts','templates','mistakes','extra','mockTests','revision','focusSessions','practiceQuestions','practiceLogs'].forEach(function(k){if(!Array.isArray(x[k])) x[k]=[];});
  x.plannerHours=Number.isFinite(Number(x.plannerHours))?Math.max(1,Math.min(14,Number(x.plannerHours))):4;
  x.coachDays=Array.isArray(x.coachDays)?x.coachDays.slice(0,7):d.coachDays;
  while(x.coachDays.length<7) x.coachDays.push(false);
  if(typeof x.cs!=='string') x.cs=d.cs;
  if(typeof x.ce!=='string') x.ce=d.ce;
  if(typeof x.start!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(x.start)) x.start=d.start;
  return x;
}
function load(){
  var raw=null,s=null;

  if(raw){try{s=JSON.parse(raw);}catch(e){s=null;}}

}

/* ---------- chapters ---------- */
function allCh(){return CH.concat(state.extra.map(function(e){return {id:e.id,s:e.s,k:'x',hy:0,n:e.n,note:'Chapter you added',custom:1};}));}
function chs(s){return allCh().filter(function(c){return c.s===s;});}
function chById(id){return allCh().filter(function(c){return c.id===id;})[0]||null;}
function st(id){return state.stage[id]||0;}

function phaseOf(date){
  var e=state.exams;
  if(date<'2027-01-01'&&date<e.jee1) return 'p1';
  if(date<e.jee1) return 'p2';
  if(date<e.board) return 'p3';
  return 'p4';
}
function curChapter(s,date){
  var list=chs(s),ph=phaseOf(date||today()),f=state.focus[s],i,c;
  if(f){c=list.filter(function(x){return x.id===f;})[0];if(c&&st(c.id)<4) return c;}
  var open=list.filter(function(x){return st(x.id)<4&&!state.hold[x.id];});
  if(!open.length) open=list.filter(function(x){return st(x.id)<4;});
  if(!open.length) return null;
  if(ph==='p1'){
    c=open.filter(function(x){return st(x.id)<2;})[0];if(c) return c;
  }else if(ph==='p2'){
    c=open.filter(function(x){return st(x.id)===2;})[0]||open.filter(function(x){return st(x.id)<2;})[0];if(c) return c;
  }
  var best=open[0];
  for(i=0;i<open.length;i++){if(st(open[i].id)<st(best.id)) best=open[i];}
  return best;
}

/* ---------- plan engine ---------- */
function modeOf(date){
  if(state.dayOver[date]) return 'over';
  var m=state.modes[date];
  if(m){if(m.indexOf('t:')===0&&!tplById(m.slice(2))) m=null;else return m;}
  if(state.coachDays[parse(date).getDay()]) return 'coach';
  if(state.defTpl&&tplById(state.defTpl)) return 't:'+state.defTpl;
  return 'self';
}
function mockDay(date){var n=diffDays(date,'2027-01-01');return n>=0&&n%3===2;}

function getSnap(date){
  if(state.snap[date]) return state.snap[date];
  var sn={};
  SORDER.forEach(function(s){var c=curChapter(s,date);sn[s]=c?{ch:c.id,st:st(c.id)}:null;});
  if(date===today()){state.snap[date]=sn;save();}
  return sn;
}
function retarget(s){
  var t=today(),sn=state.snap[t];
  if(!sn) return;
  var touched=Object.keys(state.done[t]||{}).some(function(k){return k.split('|')[0].split('#')[0]===s;});
  if(touched) return;
  var c=curChapter(s,t);
  sn[s]=c?{ch:c.id,st:st(c.id)}:null;
}

function stageTasks(s,c,g){
  var n=c.n,note=c.note;
  if(s==='che'){
    if(g===0){
      if(c.k==='org') return ['Read NCERT '+n+' line by line and list every reaction and reagent','Add each reaction to your Reaction Notebook ('+note+')','Close the book and write 5 conversions from memory'];
      if(c.k==='inorg') return ['Read NCERT '+n+' line by line; highlight exceptions and trends','Write trends, colours and exceptions on one sheet ('+note+')','Close the book and recall 10 facts from memory'];
      return ['Read NCERT '+n+' and note every formula','Write all formulas on your formula sheet ('+note+')','Work the NCERT solved examples to lock the formulas in'];
    }
    if(g===1) return ['Solve the NCERT in-text questions of '+n,'Solve the NCERT back exercise of '+n,'Redo every question you got wrong and log it under Mistakes'];
    if(g===2) return ['Solve 25 GUJCET and JEE PYQ MCQs of '+n,'Log each wrong answer under Mistakes','Rewrite the correct method for each wrong answer'];
    return ['Write the full '+n+' recall sheet from memory, then check it against NCERT','Redo the Mistakes items from '+n,'Solve 10 quick MCQs of '+n];
  }
  if(s==='phy'){
    if(g===0) return ['Watch a short concept video or read NCERT '+n+'; note every formula','Copy the key derivations into your derivation notebook ('+note+')','Write 2 derivations from memory without looking'];
    if(g===1) return ['Solve every NCERT solved example of '+n,'Solve the NCERT back exercise of '+n,'Mark the numericals you missed and log them under Mistakes'];
    if(g===2) return ['Solve 20 JEE Main and GUJCET PYQs of '+n+' (2021 to 2026)','Log each wrong answer under Mistakes','Re-solve 5 numericals you missed'];
    return ['Write all derivations of '+n+' from memory','Make a one-page formula sheet for '+n,'Solve 10 mixed MCQs of '+n];
  }
  if(g===0) return ['Read NCERT '+n+' theory and work the solved examples','Write every formula and identity of '+n+' on a half sheet ('+note+')','Mark the 3 hardest concepts and revisit them tomorrow'];
  if(g===1) return ['Do all NCERT exercises of '+n+', including the Miscellaneous exercise','Solve the NCERT Exemplar MCQs of '+n,'Redo the problems you got wrong'];
  if(g===2) return ['Solve 20 GUJCET and JEE PYQs of '+n+', timed','Log each wrong answer under Mistakes','Re-solve 5 problems you missed'];
  return ['Revise the formulas of '+n+' from memory','Solve 10 quick mixed problems of '+n,'Redo the Mistakes items from '+n];
}
function fallbackTasks(s){
  return ['Every '+SUBJ[s]+' chapter is finished. Solve 25 mixed PYQs across chapters','Redo the '+SUBJ[s]+' items in Mistakes','Pick your weakest chapter and rewrite its formula sheet from memory'];
}

function buildDay(date){
  var mode=modeOf(date),phase=phaseOf(date),snap=getSnap(date),m=toMin,T;
  function rowsToT(rows){return rows.map(function(r){return [r.t,m(r.s),m(r.e),r.n||''];}).sort(function(a,b){return a[1]-b[1];});}
  if(mode==='over'){
    T=rowsToT(state.dayOver[date]);
  }else if(mode.indexOf('t:')===0){
    T=rowsToT(tplById(mode.slice(2)).blocks);
  }else if(mode==='self'){
    T=[['rev',m('08:00'),m('08:45')],['che',m('09:00'),m('12:00')],['lunch',m('12:00'),m('13:30')],['phy',m('13:30'),m('16:30')],['brk',m('16:30'),m('17:30')],['mat',m('17:30'),m('20:30')],['din',m('20:30'),m('21:30')],['rec',m('21:30'),m('22:30')]];
  }else{
    var cs=m(state.cs),ce=m(state.ce);
    T=[['rev',cs-75,cs-30],['coach',cs,ce],['che',ce+30,ce+120],['din',ce+120,ce+150],['phy',ce+150,ce+240],['mat',ce+240,ce+285],['rec',ce+285,ce+310]];
  }
  var mock=(mode==='self'&&phase==='p2'&&mockDay(date));
  var dow=parse(date).getDay(),cnt={};
  var blocks=T.map(function(row){
    var id=row[0],b={id:id,s:row[1],e:row[2],date:date,tasks:[],kind:'break',subj:null,ch:null,stage:0,title:'',sub:''};
    if(mock&&id==='phy'){b.id='mock';id='mock';}
    cnt[id]=(cnt[id]||0)+1;
    if(cnt[id]>1) b.id=id+'#'+cnt[id];
    if(id==='che'||id==='phy'||id==='mat'){
      var sn=snap[id],c=sn?chById(sn.ch):null,g=sn?sn.st:0;
      if(!c){c=curChapter(id,date);g=c?st(c.id):0;}
      b.kind='sub';b.subj=id;b.ch=c;b.stage=g;
      b.title=c?c.n:SUBJ[id]+' full revision';
      b.sub=c?c.note:'';
      var arr=c?stageTasks(id,c,g):fallbackTasks(id);
      b.tasks=arr.map(function(t,i){return {key:id+'|'+(c?c.id:'-')+'|'+g+'|'+i,text:t};});
      if(id==='mat'&&mock) b.tasks.unshift({key:'mat|ana|0|0',text:'Analyse today\'s mock (45 min): write why each wrong answer happened'});
    }else if(id==='mock'){
      b.kind='mock';b.title='Full-length JEE Main mock';b.sub='3 hours, timed, no breaks';
      b.tasks=[{key:'mock|x|0|0',text:'Take the 3-hour mock (use the next unsolved JEE Main paper from the Papers tab). Aim to attempt about 40 to 45% accurately and skip tough questions without panic'},{key:'mock|x|0|1',text:'Log every wrong or skipped question under Mistakes'}];
    }else if(id==='rev'){
      b.kind='rev';b.title='Morning revision';b.sub='Active recall beats reading';
      var lc=state.last.che,lp=state.last.phy,cc=lc&&chById(lc.ch),pc=lp&&chById(lp.ch),tk=[];
      if(!cc&&!pc){
        tk=[{key:'rev|-|0|0',text:'Day 1 setup: flip through the contents pages of all three NCERT books (15 min)'},{key:'rev|-|0|1',text:'Set up three notebooks: Reaction and Formula, Derivation, Mistakes'}];
      }else{
        if(cc) tk.push({key:'rev|'+cc.id+'|0|0',text:'Chemistry (30 min): write the reactions and formulas of '+cc.n+' from memory, then check'});
        if(pc) tk.push({key:'rev|'+pc.id+'|0|1',text:'Physics (15 min): rewrite 2 derivations of '+pc.n+' without the book'});
      }
      b.tasks=tk;
    }else if(id==='rec'){
      b.kind='rec';b.title='Daily recap';b.sub='Close the day properly';
      b.tasks=[{key:'rec|x|0|0',text:'Solve 15 to 20 mixed MCQs from today\'s topics'},{key:'rec|x|0|1',text:'Write 10 reactions or formulas on a blank sheet without the book'},{key:'rec|x|0|2',text:'Tick today\'s tasks, then check tomorrow\'s chapter targets'}];
      if(dow===0) b.tasks.push({key:'rec|x|0|3',text:'Weekly review (30 min): update Syllabus stages and redo the Mistakes list'});
      if(phase==='p3'||phase==='p4') b.tasks.push({key:'rec|x|0|4',text:'Write one 4-mark answer in GSEB board format and compare it with Darpan or Marvel'});
    }else if(id==='coach'){
      b.kind='coach';b.title='Coaching';b.sub='Fixed slot';
      b.tasks=[{key:'coach|x|0|0',text:'Stay active in class and write down every doubt'},{key:'coach|x|0|1',text:'Use free slots at coaching to finish Maths NCERT exercises'}];
    }else if(id==='task'){
      b.kind='free';b.title='My task';b.sub='Added in your routine';
      b.tasks=[{key:'task|x|0|0',text:row[3]||'Task'}];
    }else{
      var names={lunch:['Lunch and rest','Screens off if you can'],brk:['Walk and tea','Move, drink water, keep the phone away'],din:['Dinner','Eat, then reset']},nmv=names[id];
      b.title=(row[3])?row[3]:(nmv?nmv[0]:'Break');b.sub=nmv&&!row[3]?nmv[1]:'';
    }
    if(row[3]&&(id==='rev'||id==='rec'||id==='coach'||id==='mock')) b.title=row[3];
    if(b.id!==id) b.tasks.forEach(function(t){t.key=b.id+t.key.slice(id.length);});
    return b;
  });
  return {mode:mode,phase:phase,blocks:blocks,mock:mock};
}

function isDone(date,key){return !!(state.done[date]&&state.done[date][key]);}
function dayStats(date){
  var d=buildDay(date),done=0,total=0,mins=0;
  d.blocks.forEach(function(b){
    if(b.kind==='break') return;
    var bd=b.tasks.filter(function(t){return isDone(date,t.key);}).length;
    done+=bd;total+=b.tasks.length;
    if(b.kind!=='coach'&&b.tasks.length) mins+=(b.e-b.s)*bd/b.tasks.length;
  });
  (state.custom[date]||[]).forEach(function(t){total++;if(t.done) done++;});
  /* Prefer the measured focus timer when it exceeds the schedule-based estimate; this avoids counting the same study time twice. */
  mins=Math.max(mins,Number(state.focusMin[date])||0);
  return {done:done,total:total,pct:total?Math.round(done*100/total):0,hours:mins/60,plan:d};
}
function streak(){
  var t=today(),n=0,d=t;
  if(dayStats(t).pct<60) d=addDays(t,-1);
  while(d>=state.start){
    if(dayStats(d).pct>=60){n++;d=addDays(d,-1);}else break;
  }
  return n;
}
function subjPct(s){
  var l=chs(s);if(!l.length) return 0;
  var sum=0;l.forEach(function(c){sum+=st(c.id);});
  return Math.round(sum*100/(4*l.length));
}
function overallPct(){
  var l=allCh(),sum=0;l.forEach(function(c){sum+=st(c.id);});
  return l.length?Math.round(sum*100/(4*l.length)):0;
}
function examList(){
  var e=state.exams;
  return [{k:'jee1',tag:'JEE',n:'JEE Main Session 1',d:e.jee1},{k:'board',tag:'BRD',n:'GSEB Class 12 boards start',d:e.board},{k:'gujcet',tag:'CET',n:'GUJCET',d:e.gujcet},{k:'jee2',tag:'JE2',n:'JEE Main Session 2',d:e.jee2}].filter(function(x){return x.d;});
}

/* ---------- html builders ---------- */
function taskHTML(date,key,text,done,editable){
  return '<label class="task'+(done?' is-done':'')+'"><input type="checkbox" data-act="tick" data-date="'+date+'" data-key="'+esc(key)+'"'+(done?' checked':'')+(editable?'':' disabled')+'><span class="box" aria-hidden="true"></span><span class="txt">'+esc(text)+'</span></label>';
}
function blockHTML(date,b,editable,nowId){
  if(b.kind==='break'){
    return '<div class="brk"><span>'+esc(b.title)+'</span><span class="time">'+t12(b.s)+' to '+t12(b.e)+'</span></div>';
  }
  var dn=b.tasks.filter(function(t){return isDone(date,t.key);}).length,tot=b.tasks.length;
  var all=tot>0&&dn===tot;
  var cls='blk k-'+b.kind+(b.subj?' s-'+b.subj:'')+(all?' is-done':'')+(nowId===b.id?' is-now':'');
  var pill=b.subj?SUBJ[b.subj]:(b.kind==='mock'?'Mock':b.kind==='rev'?'Revision':b.kind==='rec'?'Recap':b.kind==='free'?'Task':'Coaching');
  var h='<section class="'+cls+'"><div class="bh"><span class="time">'+t12(b.s)+' to '+t12(b.e)+'</span><span class="pill">'+pill+' · '+dn+'/'+tot+'</span></div>';
  h+='<h3>'+esc(b.title)+'</h3>';
  if(b.kind==='sub'&&b.ch) h+='<div class="hint">Stage '+(b.stage+1)+' of 4: '+STAGES[b.stage]+'. '+esc(b.sub)+'</div>';
  else if(b.sub) h+='<div class="hint">'+esc(b.sub)+'</div>';
  if(b.kind==='sub'&&editable&&date===today()){
    var opts=chs(b.subj).filter(function(c){return st(c.id)<4||(b.ch&&c.id===b.ch.id);});
    h+='<div class="field"><label>Chapter for today</label><select class="blksel" data-act="blkch" data-subj="'+b.subj+'" aria-label="Change chapter">'+opts.map(function(c){return '<option value="'+c.id+'"'+((b.ch&&b.ch.id===c.id)?' selected':'')+'>'+esc(c.n)+(state.hold[c.id]?' (not taught yet)':'')+'</option>';}).join('')+'</select></div>';
  }
  h+='<div class="tasks">'+b.tasks.map(function(t){return taskHTML(date,t.key,t.text,isDone(date,t.key),editable);}).join('')+'</div>';
  if(b.kind==='sub'&&b.ch&&editable&&date===today()){
    var cur=st(b.ch.id);
    if(cur>b.stage){
      h+='<div class="stagebar"><span class="ok">'+STAGES[b.stage]+' stage of this chapter is complete.</span>';
      if(curChapter(b.subj,date)) h+='<button class="btn" data-act="nextstage" data-subj="'+b.subj+'">Start next stage now</button>';
      h+='</div>';
    }else if(all){
      h+='<div class="stagebar"><button class="btn primary" data-act="finish" data-subj="'+b.subj+'">Mark '+esc(STAGES[b.stage])+' done for this chapter</button></div>';
    }
  }
  return h+'</section>';
}
function customHTML(date,editable){
  var list=state.custom[date]||[];
  var h='<section class="card mine"><h3>My own tasks</h3>';
  if(list.length){
    h+='<div class="tasks">'+list.map(function(t){
      return '<div style="display:flex;align-items:center;gap:6px">'+taskHTML(date,'c:'+t.id,t.text,t.done,editable).replace('<label class="task','<label style="flex:1" class="task')+(editable?'<button class="mini" data-act="delcustom" data-date="'+date+'" data-id="'+t.id+'" aria-label="Delete task">Delete</button>':'')+'</div>';
    }).join('')+'</div>';
  }else h+='<div class="muted">Nothing added for this day.</div>';
  if(editable) h+='<form class="row" data-act="addcustom" data-date="'+date+'"><input type="text" name="t" id="ct-'+date+'" placeholder="Add a task for this day" maxlength="120" aria-label="New task"><button class="btn primary" type="submit">Add</button></form>';
  return h+'</section>';
}
function daySection(date,editable,nowId){
  var s=dayStats(date),d=s.plan,t=today();
  var h='<section class="card sum"><div class="sumrow"><span>'+(date===t?'Today':longDate(date))+' · '+esc(modeLabel(d.mode))+'</span><b>'+s.pct+'%</b></div>';
  h+='<div class="bar" aria-hidden="true"><i style="width:'+s.pct+'%"></i></div>';
  h+='<div class="sumrow"><span>'+s.done+' of '+s.total+' tasks</span><span>'+s.hours.toFixed(1)+' h studied</span></div>';
  h+='<div class="field"><label for="msel-'+date+'">Routine for this day</label><select id="msel-'+date+'" data-act="modesel" data-date="'+date+'"><option value="self"'+(d.mode==='self'?' selected':'')+'>Self-study day</option><option value="coach"'+(d.mode==='coach'?' selected':'')+'>Coaching day</option>'+state.templates.map(function(t){return '<option value="t:'+t.id+'"'+(d.mode==='t:'+t.id?' selected':'')+'>'+esc(t.name)+'</option>';}).join('')+(d.mode==='over'?'<option value="self" selected>Custom (today only)</option>':'')+'</select></div>';
  h+='<div class="links">'+((editable&&date===t)?'<button class="btn" data-act="redit">Edit routine and timings</button>':'')+'<button class="btn" data-act="copyroute" data-date="'+date+'">Copy routine</button></div>';
  if(!editable) h+='<div class="muted">Preview. Tasks can be ticked from this day onward.</div>';
  h+='</section>';
  if(editing&&editable&&date===t){h+=editorHTML();return h;}
  h+=d.blocks.map(function(b){return blockHTML(date,b,editable,nowId);}).join('');
  h+=customHTML(date,editable);
  return h;
}

/* ---------- adviser ---------- */
function phaseLine(date){
  var p=phaseOf(date),e=state.exams,j=diffDays(e.jee1,date),b=diffDays(e.board,date);
  if(p==='p1') return 'Phase 1, foundation: finish Learn and Exercises for the high-yield chapters. JEE Main is '+j+' days away.';
  if(p==='p2') return 'Phase 2, JEE sprint: PYQs on finished chapters and a full mock every 3rd day. '+j+' days to JEE Main.';
  if(p==='p3') return 'Phase 3, board revision: close every open chapter, then practise board-style answers. Boards start in '+Math.max(b,0)+' days.';
  return 'Phase 4, board exam window: revise paper by paper, then switch to GUJCET.';
}
function adviceLines(date){
  var lines=[phaseLine(date)];
  var y=addDays(date,-1);
  if(y>=state.start){
    var ys=dayStats(y);
    if(ys.total&&ys.pct<60) lines.push('Yesterday you finished '+ys.pct+'%. Close the open tasks before adding anything new today.');
    else if(ys.pct>=80) lines.push('Yesterday was strong ('+ys.pct+'%). Keep the same pace.');
  }
  var open=state.mistakes.filter(function(x){return !x.fixed;}).length;
  if(open>=5) lines.push(open+' unfixed mistakes are waiting in Progress. Clear 3 of them today.');
  var doy=Math.floor(diffDays(date,'2026-01-01'));
  lines.push(TIPS[((doy%TIPS.length)+TIPS.length)%TIPS.length]);
  return lines;
}
function nextFocus(){
  var d=addDays(today(),1),out=[];
  SORDER.forEach(function(s){var c=curChapter(s,d);out.push(SUBJ[s]+': '+(c?c.n:'revision'));});
  return out.join(' · ');
}
function adviserCard(){
  var t=today(),s=dayStats(t),d=s.plan,now=new Date(),nm=now.getHours()*60+now.getMinutes();
  var hr=now.getHours(),gr=hr<5?'Late night':hr<12?'Good morning':hr<17?'Good afternoon':hr<21?'Good evening':'Good night';
  var act=d.blocks.filter(function(b){return b.kind!=='break'&&b.tasks.length;});
  var cur=d.blocks.filter(function(b){return nm>=b.s&&nm<b.e;})[0]||null;
  var head,body,nowId=null;
  function firstOpen(b){return b.tasks.filter(function(x){return !isDone(t,x.key);})[0];}
  if(s.total>0&&s.done===s.total){
    head='All tasks done. Well finished.';
    body='Tomorrow: '+nextFocus()+'.';
  }else if(cur&&cur.kind!=='break'){
    nowId=cur.id;
    var ft=firstOpen(cur);
    head='Now: '+cur.title;
    body=(ft?'Start with: '+ft.text+'. ':'This block is done. ')+hm(cur.e-nm)+' left in this slot.';
  }else if(cur&&cur.kind==='break'){
    var nx=act.filter(function(b){return b.s>=cur.e;})[0];
    head='Break: '+cur.title;
    body=nx?('Next at '+t12(nx.s)+': '+nx.title+'.'):'Rest up.';
  }else{
    var up=act.filter(function(b){return b.s>nm;})[0];
    if(up){head='Next at '+t12(up.s)+': '+up.title;body=up.tasks[0]?up.tasks[0].text+'.':'';}
    else{
      head='The day\'s slots are over';
      body=(s.total-s.done)+' task'+((s.total-s.done)===1?'':'s')+' still open. Finish the shortest one before sleeping. Tomorrow: '+nextFocus()+'.';
    }
  }
  var lines=adviceLines(t);
  var circ=2*Math.PI*26,off=circ*(1-s.pct/100);
  var ring='<div class="ring" role="img" aria-label="'+s.pct+' percent of today done"><svg viewBox="0 0 64 64"><circle class="tr" cx="32" cy="32" r="26" fill="none" stroke-width="7"></circle><circle class="pg" cx="32" cy="32" r="26" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"></circle></svg><span>'+s.pct+'%</span></div>';
  return {html:'<section class="card adviser"><div class="toprow"><div><div class="lbl">'+gr+' · '+t12(nm)+'</div><h2>'+esc(head)+'</h2></div>'+ring+'</div><p>'+esc(body)+'</p><div class="lines">'+lines.map(function(l){return '<div>'+esc(l)+'</div>';}).join('')+'</div></section>',nowId:nowId};
}

var BTYPES=[['rev','Morning revision'],['che','Chemistry'],['phy','Physics'],['mat','Maths'],['mock','Mock test'],['rec','Daily recap'],['coach','Coaching'],['task','Custom task'],['brk','Break or meal']];
function tplById(id){return state.templates.filter(function(t){return t.id===id;})[0]||null;}
function hhmm(min){min=((min%1440)+1440)%1440;return pad(Math.floor(min/60))+':'+pad(min%60);}
function modeLabel(mode){
  if(mode==='self') return 'self-study day';
  if(mode==='coach') return 'coaching day';

        var o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+i*0.4;

function weakTopics(){
 var out=[];
 SORDER.forEach(function(sub){
  var open=state.mistakes.filter(function(m){return m.s===sub&&!m.fixed;}).length;
  var tests=state.mockTests.filter(function(t){return t.s===sub;});
  var qs=state.practiceLogs.filter(function(t){return t.subjectStats&&t.subjectStats[sub];});
  var qTotal=qs.reduce(function(a,x){return a+x.subjectStats[sub].total;},0),qCorrect=qs.reduce(function(a,x){return a+x.subjectStats[sub].correct;},0);
  var acc=qTotal?Math.round(qCorrect/qTotal*100):null;
  var testAcc=tests.length?Math.round(tests.reduce(function(a,x){return a+x.accuracy;},0)/tests.length):null;
  var score=(open*12)+(acc===null?0:Math.max(0,70-acc)*.35)+(testAcc===null?0:Math.max(0,70-testAcc)*.25);
  out.push({s:sub,open:open,accuracy:acc,testAccuracy:testAcc,score:score});
 });
 return out.sort(function(a,b){return b.score-a.score;});
}
function readiness(){
 var syl=overallPct(),tests=state.mockTests,practice=state.practiceLogs;
 var mock=tests.length?tests.reduce(function(a,x){return a+x.accuracy;},0)/tests.length:0;
 var prac=practice.length?practice.reduce(function(a,x){return a+x.accuracy;},0)/practice.length:0;
 var due=state.revision.filter(function(r){return !r.done;}).length,done=state.revision.filter(function(r){return r.done;}).length,total=due+done;
 var rev=total?done/total*100:0;
 var score=Math.round(syl*.35+mock*.35+prac*.2+rev*.1);
 var evidence=(tests.length>0?1:0)+(practice.length>0?1:0)+(total>0?1:0);
 return {score:score,syl:syl,mock:Math.round(mock),prac:Math.round(prac),rev:Math.round(rev),evidence:evidence,tests:tests.length,practice:practice.length};
}
